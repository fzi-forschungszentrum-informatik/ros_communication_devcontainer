# Fitted network profiles, 2026-08 cellular field campaign.
#
# Eleven drive windows of a remote-assistance vehicle on a public 4G/5G uplink in
# Karlsruhe, Germany, each fitted from the passive recording of its application
# traffic. Every window gives two profiles:
#
#   <key>-steady   one-way delay, jitter and per-packet loss of the steady state
#   <key>-events   one cycle: the steady state for the fitted mean time between
#                  events, then one short event
#
# Load them with `profiles: <path to this file>` in rosotacom.yaml and select one
# with `--profile <name>`. The table of windows is in README.md next to this file.
#
# Loss is per packet, as netem applies it: the fitted loss rate of one DDS
# fragment of the size given with each window. A message of n fragments is lost
# with probability 1-(1-p)^n, the model the rates were fitted with, so use them
# as they are on a link that fragments at that size. The event rate is fitted
# on the 100 ms slots that lost a message. No profile sets a loss correlation:
# netem's correlated loss does not keep the stated rate (`loss 4% 25%` drops
# about 0.1 % of packets). Burst loss is expressed by the <key>-events timeline;
# netem's gemodel (network profiles reference) is the alternative. Delay includes the
# operator-side bridge hop.
# The uplink rate is not identifiable from a passive recording (the link never
# saturated), so no profile sets one; the downlink was not fitted.
# r3 is the window the fit is validated on: replay/ next to this file replays its
# camera stream through r3-steady and r3-events (README.md, "Replay check").

profiles:

  # r3: 2026-08-17 14:57, Oststadt, ROS 2 Kilted, 1200 B DDS fragments
  # per-fragment loss (1200 B): steady 0.098 %, event 4.00 %
  r3-steady:
    uplink: { delay: 29ms, jitter: 32ms, distribution: paretonormal, loss: 0.098% }
  r3-events:
    timeline:
      - { for: 2.8s, uplink: { delay: 29ms, jitter: 32ms, distribution: paretonormal, loss: 0.098% } }
      - { for: 0.11s, uplink: { delay: 34ms, jitter: 48ms, loss: 4.00% } }

