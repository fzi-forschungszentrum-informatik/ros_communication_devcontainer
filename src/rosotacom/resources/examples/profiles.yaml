# Illustrative network profiles (network profiles reference — the emulated environment axis).
#
# A profile is a declarative tc/netem condition applied *below* rosotacom on the
# OTA interface, per direction (uplink != downlink — the defining feature of
# cellular). Select one with `rosotacom <cmd> --profile <name>`; `--profile none`
# (or omission) is the unshaped rung.
#
# These NUMBERS ARE ILLUSTRATIVE. Real, calibrated per-link profiles live in the
# operator's private baseline, not in this public example. Re-measure per link.
profiles:

  # Static "typical cellular" — the standard reproducible point condition.
  cellular-typical:
    uplink:   { rate: 4mbit,  delay: 120ms, jitter: 30ms, distribution: normal, loss: 2%, loss_correlation: 25% }
    downlink: { rate: 25mbit, delay: 60ms,  jitter: 20ms, loss: 0.5% }

  # Timeline — the substrate for the recovery genre (good -> degrade -> outage ->
  # restore). `outage: catchup` keeps the interface up (loss 100%; DDS survives,
  # recovery is "catch up"); use `reconnect` for the harsher link-down recovery.
  cellular-handover:
    timeline:
      - { for: 30s, uplink: { rate: 4mbit,   delay: 60ms,  loss: 0.1% } }
      - { for: 15s, uplink: { rate: 1mbit,   delay: 180ms, loss: 3%   } }
      - { for: 5s,  outage: catchup }
      - { for: 40s, uplink: { rate: 2.5mbit, delay: 90ms,  loss: 1%   } }

  # performance bands reference gate profiles — the canonical public conditions of the regression
  # gate (see resources/benched-set.yaml). Deliberately plain committed netem
  # numbers with NO random elements: gated metrics are pinned by the emulated
  # rate/delay bottleneck, which is deterministic without a netem seed. This is
  # not optional on the public runner class — GitHub-hosted `tc` rejects the
  # netem `seed` option ("What is 'seed'?"), so seeded random loss/jitter cannot
  # even be installed there, and unseeded random netem would be non-deterministic.
  # A gate profile therefore uses rate/delay only (contract-tested); seeded
  # *load* randomness (sized_publisher interval jitter) is application-level and
  # works everywhere. Seeded random netem stays in the operator harness lanes.
  gate-nominal:
    uplink:   { rate: 20mbit, delay: 20ms }
    downlink: { rate: 20mbit, delay: 20ms }

  gate-tight:
    uplink:   { rate: 1mbit, delay: 40ms }
    downlink: { rate: 10mbit }

  # Public finding fixtures. These are small, deterministic emulation points used
  # by docs/findings; they intentionally carry no private host or calibration data.
  finding-3.2mbit:
    uplink: { rate: 3.2mbit }
    downlink: {}

  finding-3.1mbit:
    uplink: { rate: 3.1mbit }
    downlink: {}

  finding-delay-5ms:
    uplink: { delay: 5ms }
    downlink: {}

  finding-delay-50ms:
    uplink: { delay: 50ms }
    downlink: {}

  finding-delay-300ms:
    uplink: { delay: 300ms }
    downlink: {}

  finding-jitter18:
    uplink: { delay: 30ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-jitter27:
    uplink: { delay: 30ms, jitter: 27ms, distribution: normal }
    downlink: {}

  finding-3.2mbit-jitter18:
    uplink: { rate: 3.2mbit, delay: 30ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-tight-irregular:
    uplink: { rate: 3.2mbit, delay: 50ms, jitter: 18ms, distribution: normal }
    downlink: {}

  finding-spdp-tight:
    uplink: { rate: 3.2mbit }
    downlink: {}

  # ---- field-fitted: 2026-08-17 cellular field drive --------------------
  # Fitted on 91765 wrapped messages over 1195 s: two-layer
  # fragment loss (steady 0.098% per 1200 B fragment; short intense events,
  # bad ~113 ms every ~2.8 s at ~2.7%/fragment), one-way delay p50 ~29 ms
  # with a lognormal tail (p99 ~239 ms) that the builtin `normal` under-tails
  # ~2x -> custom table dist/field-20260817.dist, generated by
  # `python -m rosotacom.netem_dist` from the drive's 46882 steady
  # small-message delay samples.
  #
  # gemodel state transitions are PER PACKET: p/r below assume that drive's
  # full-link rate (~350 fragments/s), where good ~2.8 s ~ 980 packets and
  # bad ~113 ms ~ 40 packets. A single-stream replay at, say, ~105 packets/s
  # stretches the same states 3x in time - offer full-link load or rescale
  # p and r by (350 / your packet rate).
  #
  # Occurrence weights on that drive: quiet ~45% of seconds (-steady),
  # disturbed ~30% (-events), soggy tail ~5% (-soggy). Route-level capacity
  # risk on top (Submission-II b2 uplink iperf, 3.5 Mbit/s offered):
  # <1 Mbit/s in 4.3% of seconds, target not reached in ~66%.
  field-20260817-steady:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 0.098%
    downlink: { delay: 7ms, jitter: 5ms }

  # Whole-drive loss process incl. events. Container fragment replay of the
  # drive's camera frame process under this profile (2026-08-18): overall
  # loss 1.9-2.7% with the KF/delta split 6.7%/0.7% (drive: 1.93% net,
  # KF 4.7%/delta 1.2%) - magnitude and size-dependence reproduced.
  field-20260817-events:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.102%, r: 2.5%, loss_bad: 2.7%, loss_good: 0.098% }
    downlink: { delay: 7ms, jitter: 5ms }

  # The drive's last minute (case5, 1140-1195 s): delay up (p90 ~138 ms),
  # loss nearly gone, offered load low - the queue-not-loss regime.
  field-20260817-soggy:
    uplink:
      delay: 70ms
      jitter: 45ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 0.02%
    downlink: { delay: 7ms, jitter: 5ms }

  # ---- degradation cases (same drive; case bags in the report's cases/) ---
  # case1 keyframe-loss (193-216 s) and case4 burst (958-990 s) are the
  # -events process itself: play the case bag against field-20260817-events.
  # case5 soggy-end is field-20260817-soggy.

  # case2 (630-700 s): densest event clustering of the drive - bad states
  # ~2x more frequent than the whole-drive fit, elevated steady loss.
  field-20260817-case2-weak-zone:
    uplink:
      delay: 30ms
      jitter: 22ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.2%, r: 2.5%, loss_bad: 2.7%, loss_good: 0.15% }
    downlink: { delay: 7ms, jitter: 5ms }

  # case3 (714-748 s): in-flight queueing to 1.4 s with almost no loss.
  # Reproduced by a rate crunch just below the offered load: the queue sits
  # in the netem child (default limit 1000 packets), so delay climbs while
  # nothing drops - a 9% oversubscription reached 3.6 s delay at 0% loss in
  # the 2026-08-18 container replay.
  field-20260817-case3-delay-jam:
    timeline:
      - { for: 10s, uplink: { delay: 25ms, jitter: 18ms } }
      - { for: 15s, uplink: { rate: 900kbit, delay: 25ms } }
      - { for: 20s, uplink: { delay: 25ms, jitter: 18ms } }

  # case6 (495-516 s): a 725 ms hole already in the vehicle's own 20 Hz
  # camera stream - a source-side case. Deliberately unshaped: play the case
  # bag with `--profile none` to see that the link is not the cause.
  field-20260817-case6-source-gap: {}

  # ---- fragment-law tilt (B1): three loss processes, one delay model -------
  # The field fit says message loss follows 1-(1-p)^ceil(size/F) and the field
  # residual is systematic in size: the smallest class loses about half of what
  # the fit predicts and the largest about 2.9x more. The campaign cannot
  # separate an accounting artefact from a property of the link. These three
  # can: the delay model is the drive's own table in all of them, and the only
  # thing that moves is how the loss is distributed over packets.
  #
  # The rate is raised to ~1% per packet in every arm so a 240 s run at 10 Hz
  # resolves the small end; the law's *form* is what is under test, and it does
  # not depend on the level.

  # A -- independent per packet. The law is exact by construction here, so this
  # arm measures the measurement chain and nothing else.
  tilt-iid:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 1%
    downlink: { delay: 7ms, jitter: 5ms }

  # B -- the drive's own two-state process, scaled to the same mean. Clustering
  # correlates the fragments of one message, so large messages should lose
  # *less* than the independent law predicts -- the opposite sign to the field.
  # p and r are the drive's, so the runs and gaps keep their measured lengths.
  tilt-bursty:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.102%, r: 2.5%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  # C -- A plus a queue a burst can fill. 4 Mbit/s is above the largest class's
  # mean offered rate (38 kB at 10 Hz is ~3.0 Mbit/s of payload) and below its
  # instantaneous one, so a 38-fragment message meets a queue and a 1-fragment
  # message does not. That is the burst-tilt candidate, isolated.
  tilt-iid-queued:
    uplink:
      rate: 4mbit
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 1%
    downlink: { delay: 7ms, jitter: 5ms }

  # B2 -- the boundary of the design rule. Same delay model, two per-fragment
  # rates: the one the rule is applied at, and one twice as bad. The rule says
  # what the size distribution does; it does not say what the link will be.
  tilt-iid-worse:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 2%
    downlink: { delay: 7ms, jitter: 5ms }

  # B4 -- a serialisation constraint tight enough that a burst cannot fit in
  # its own send interval, which is the shape an EN-DC uplink on a TDD carrier
  # would present from above: a small probe survives what a 38-fragment burst
  # does not.
  tilt-iid-tight:
    uplink:
      rate: 1.5mbit
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss: 1%
    downlink: { delay: 7ms, jitter: 5ms }

  # B1-prime -- the two-state process with its chain rescaled per cell.
  #
  # netem advances a Gilbert-Elliott chain once per *packet*, so the fitted p
  # and r describe a process in packets and not in time. At the drive's own
  # 380 fragments/s they mean a bad run of about 105 ms; on a size ladder at a
  # fixed 10 Hz the packet rate is N x 10, so the same p and r stretch the bad
  # run by 380/(N x 10) and every cell meets a different link. Forcing the
  # packet rate constant instead was tried and measured the wrong thing: the
  # pipeline serves messages, not packets, and at 60 messages/s the depth-1 OTA
  # queue overwrites its own backlog -- both loss processes then reported
  # 10.7 % to two digits.
  #
  # So the chain is rescaled instead: p and r are multiplied by 380/(N x 10) in
  # each cell, which leaves the stationary bad fraction at 3.92 % and the mean
  # loss at 1 % while making the bad run 105 ms of wall clock everywhere. The
  # comparison against `tilt-iid` is then a comparison of one thing.

  bp-frag-one:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 3.876%, r: 95%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  bp-frag-two:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 1.938%, r: 47.5%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  bp-frag-four:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.969%, r: 23.75%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  bp-frag-six:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.646%, r: 15.83%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  bp-frag-twelve:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.323%, r: 7.917%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }

  bp-frag-thirtyeight:
    uplink:
      delay: 25ms
      jitter: 18ms
      distribution: field-20260817
      distribution_file: dist/field-20260817.dist
      loss_gemodel: { p: 0.102%, r: 2.5%, loss_bad: 13.5%, loss_good: 0.49% }
    downlink: { delay: 7ms, jitter: 5ms }
