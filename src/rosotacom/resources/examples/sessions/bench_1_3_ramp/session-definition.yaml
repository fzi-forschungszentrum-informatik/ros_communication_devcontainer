# Benchmark Test 1.3 — Sustained Degradation Ramp
#
# Linear ramp test: the benchmark driver progressively increases payload
# size or publish rate on a single stream to find the degradation knee
# and saturation point of the link under a fixed environment profile.

experimental: true
local_check: false

peers:
  a: {}
  b: {}

peer_settings:
  a:
    domain_id: 53
  b:
    domain_id: 54

shared:
  use_topic_monitor: true
  use_heartbeat: false
  use_status_overview: true
  ota_domain_id: 55
  rmw: cyclone

  qos:
    defaults:
      depth: 1
    for_role:
      ota_sub:
        reliability: best_effort
      ota_pub:
        reliability: best_effort

topics:
  a_to_b:
    - topic: "/bench_ramp"
      type: "com_msgs/msg/SizedPayload"
      processing:
        use_ota_wrapper: true
