peers:
  a: {}
  b: {}

peer_settings:
  a:
    domain_id: 46
  b:
    domain_id: 47

shared:
  use_topic_monitor: true
  use_heartbeat: true
  use_status_overview: true
  heartbeat:
    expect:
      hz: { min: 5, max: 20 }
      latency_ms: { max: 1000 }
      loss_pct: { max: 5 }
  ota_domain_id: 48

  rmw:
    local: cyclone
    ota:
      zenoh_ros2dds:
        # Explicit, and deliberately the non-default: `tcp` is what a link gets
        # by default since it measured better on the operator's bench pair, so
        # something has to keep exercising the UDP bridge.
        transport: udp
        main_peer: a
        main_port: 7447

topics:
  b_to_a:
    - topic: "/heartbeat_b"
      type: "com_msgs/msg/EchoHeartbeat"
      zen_qos:
        priority: real_time
    - topic: "/costmap/costmap"
      type: "nav_msgs/msg/OccupancyGrid"
      processing:
        restamp_if: true
        compress: true
      zen_qos:
        priority: data
        express: true
