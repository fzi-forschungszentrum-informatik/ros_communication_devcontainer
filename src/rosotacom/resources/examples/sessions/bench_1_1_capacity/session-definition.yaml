# Benchmark Test 1.1 — Capacity
#
# Minimum-requirement test: a single large-payload stream at a fixed rate
# (e.g. 20 Hz / GOP-1) is sent while the benchmark driver sweeps the
# environment profile (network shaping, CPU load, etc.).
# Payload size and rate are injected via CLI at runtime.

experimental: true
local_check: false

peers:
  a: {}
  b: {}

peer_settings:
  a:
    domain_id: 50
  b:
    domain_id: 51

shared:
  use_topic_monitor: true
  use_heartbeat: false
  use_status_overview: true
  ota_domain_id: 52
  rmw: cyclone

  qos:
    defaults:
      depth: 1
    for_role:
      ota_sub:
        reliability: best_effort
      ota_pub:
        reliability: best_effort

topics:
  a_to_b:
    - topic: "/bench_capacity"
      type: "com_msgs/msg/SizedPayload"
      processing:
        use_ota_wrapper: true
